model_name: 'transNAR'

llm_type: "gpt"


# CNN
channels: [16, 16, 16]
strides: [1,1,1,1,1]

# Encoder MLP
encoder_layers: 1
last_convs: [400]
encoder_dims: [64]

# GNN
graph_filters: [3]
node_dims: [128]

# Policy MLP
action_layers: 1

# Training
epochs: 100
tests_episodes: 100
net_type: 'gnn'
msg_type: 'gcn'
# Simulation
board_size: [8,8]
map_shape: [8,8]
num_agents: 8
obstacles: 6
max_steps: 24
max_time: 32
sensing_range: 6

min_time: 1
